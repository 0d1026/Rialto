name: eval diagnosis (per-category)

# Phase 0 of the ranking plan: run the golden-set eval on CI's pgvector Postgres
# and surface the per-query / per-category breakdown, so we can see which
# categories drag ranking down before touching any ranking code. Manual trigger
# only - this is a diagnosis, not a gate.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: eval
          POSTGRES_DB: rialto_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run golden-set eval and record per-category breakdown
        working-directory: packages/eval-harness
        env:
          DATABASE_URL: postgresql://postgres:eval@localhost:5432/rialto_eval
        run: pnpm eval:record
      - name: Upload diagnosis JSON
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-diagnosis
          path: packages/eval-harness/results/golden-latest.json
          if-no-files-found: error
