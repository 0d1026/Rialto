[package]
name = "upto-settlement"
version = "0.1.0"
edition = "2021"
description = "Stateless Soroban settlement contract for the x402 upto scheme"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=27.0.5"

[dev-dependencies]
soroban-sdk = { version = "=27.0.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
